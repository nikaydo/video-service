name: Go

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Тесты и статический анализ
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tester
          POSTGRES_PASSWORD: tester
          POSTGRES_DB: tester
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tester -d tester"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://tester:tester@localhost:5432/tester?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - name: Установить Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true

      # Контракт лежит в соседнем репозитории, а не в модуле. Подменяем путь
      # на локальную копию, иначе сборка не найдёт зависимость.
      - name: Взять контракт из соседнего репозитория
        run: |
          git clone --depth 1 https://github.com/nikaydo/grpc-contract.git ../grpc-contract
          go mod edit -replace github.com/nikaydo/grpc-contract=../grpc-contract

      - name: Скачать зависимости
        run: go mod download

      - name: Проверить форматирование
        run: |
          unformatted="$(gofmt -l . | grep -v '^$' || true)"
          if [ -n "$unformatted" ]; then
            echo "Файлы требуют gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Тесты
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      - name: Сборка
        run: go build -trimpath -o /tmp/video-service ./cmd

  docker:
    name: Сборка образа
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Взять контракт
        run: git clone --depth 1 https://github.com/nikaydo/grpc-contract.git ../grpc-contract

      - name: Собрать образ
        run: docker build --build-arg CONTRACT_PATH=../grpc-contract -t video-service:ci .

      - name: Проверить, что .env не попал в образ
        run: |
          if docker run --rm --entrypoint sh video-service:ci -c 'test -f /app/.env'; then
            echo ".env попал в образ"
            exit 1
          fi
          echo ".env в образе отсутствует"
